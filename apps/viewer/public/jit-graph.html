get": "n58", "data": {"edgeStyle": "solid"}}, {"source": "n58", "target": "n59", "data": {"edgeStyle": "solid"}}, {"source": "n59", "target": "n60", "data": {"edgeStyle": "solid"}}, {"source": "n60", "target": "n61", "data": {"edgeStyle": "solid"}}, {"source": "n61", "target": "n62", "data": {"edgeStyle": "solid"}}, {"source": "n62", "target": "n63", "data": {"edgeStyle": "solid"}}, {"source": "n63", "target": "n64", "data": {"edgeStyle": "solid"}}, {"source": "n64", "target": "n65", "data": {"edgeStyle": "solid"}}, {"source": "n65", "target": "n66", "data": {"edgeStyle": "solid"}}, {"source": "n66", "target": "n67", "data": {"edgeStyle": "solid"}}, {"source": "n67", "target": "n68", "data": {"edgeStyle": "solid"}}, {"source": "n68", "target": "n69", "data": {"edgeStyle": "solid"}}, {"source": "n69", "target": "n70", "data": {"edgeStyle": "solid"}}], "dimensions": {"height": 7000, "width": 600}, "type": "role", "status": "published"};
    
    // Parse frontend data (similar to roadmapLayoutEngine)
    function parseFrontendData(frontendData) {
      if (!frontendData?.nodes || !frontendData?.edges) return { nodes: [], edges: [] };
      
      const nodes = frontendData.nodes.map((apiNode) => {
        const pos = apiNode.position || { x: 0, y: 0 };
        const nodeData = apiNode.data || {};
        let type = apiNode.type;
        if (type === 'subtopic') type = 'topic';
        
        return {
          id: apiNode.id,
          type: type === 'vertical' ? 'vertical' : 
                type === 'horizontal' ? 'horizontal' :
                type === 'section' ? 'section' :
                type === 'paragraph' ? 'paragraph' :
                type === 'title' ? 'title' :
                type === 'button' ? 'button' :
                type === 'legend' ? 'legend' : 'topic',
          position: { x: pos.x, y: pos.y },
          data: {
            label: nodeData.label || '',
            note: nodeData.note,
            color: nodeData.color,
            nodeType: nodeData.nodeType,
            phase: nodeData.phase,
          },
          style: { width: 220, height: 60 },
          draggable: true,
          selectable: true,
        };
      });
      
      const edges = frontendData.edges.map((apiEdge, idx) => ({
        id: apiEdge.id || `edge-${apiEdge.source}-${apiEdge.target}`,
        source: apiEdge.source,
        target: apiEdge.target,
        type: 'bezier',
        data: { edgeStyle: apiEdge.data?.edgeStyle || 'solid' },
        style: { stroke: '#2B78E4', strokeWidth: 2.5 },
        markerEnd: { type: MarkerType.ArrowClosed, color: '#2B78E4' },
      }));
      
      return { nodes, edges };
    }

    // Custom Node Components
    function TopicNode({ data, selected }) {
      const { label = '', note, color, nodeType, phase } = data;
      const isTopic = nodeType === 'topic' || nodeType === 'phase' || nodeType === 'knowledge' || nodeType === 'implement';
      const className = `roadmap-node topic-node ${isTopic ? 'topic' : 'subtopic'} ${selected ? 'selected' : ''} react-flow__node-${nodeType || ''}`;
      
      // Phase color badge
      const phaseColors = { 1: '#2b78e4', 2: '#27ae60', 3: '#8e44ad', 4: '#f39c12', 5: '#e74c3c', 6: '#16a085' };
      const phaseNames = { 1: 'SETUP', 2: 'DATA', 3: 'AI CORE', 4: 'CONFIG', 5: 'UI', 6: 'TEST' };
      const pColor = phase ? phaseColors[phase] : color;
      const pName = phase ? phaseNames[phase] : '';
      
      return React.createElement('div', {
        className: className,
        style: { 
          backgroundColor: isTopic ? '#fff3cd' : '#fff8e1',
          borderColor: pColor || '#000',
          minWidth: isTopic ? '220px' : '180px',
          maxWidth: isTopic ? '300px' : '280px',
          padding: '10px 14px',
          position: 'relative',

        React.createElement(Handle, { key: 'l', type: 'target', position: Position.Left, className: 'node-handle side' }),
        React.createElement(Handle, { key: 'r', type: 'source', position: Position.Right, className: 'node-handle side' }),
        React.createElement('div', { key: 'content', className: 'node-content', style: { display: 'flex', flexDirection: 'column', gap: '4px' } }, [
          React.createElement('span', { key: 'label', className: 'node-label', style: { fontWeight: 500, fontSize: '13px' } }, label),
          note && React.createElement('div', { key: 'note', className: 'node-note', style: { fontSize: '10px', color: '#666', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, note),
          pName && React.createElement('div', { key: 'phase', className: 'phase-badge', style: { background: pColor, color: 'white', borderRadius: '10px', padding: '2px 8px', fontSize: '9px', fontWeight: 600, display: 'inline-block', width: 'fit-content' } }, pName),
        ])
      ]);
    }

    function StartNode({ data }) {
      return React.createElement('div', {
        className: 'react-flow__node-start',
        style: { padding: '12px 20px', borderRadius: '8px', fontWeight: 600, color: '#155724', background: '#d4edda', border: '2px solid #28a745' }
      }, data.label);
    }

    function EndNode({ data }) {
      return React.createElement('div', {
        className: 'react-flow__node-end',
        style: { padding: '12px 20px', borderRadius: '8px', fontWeight: 600, color: '#721c24', background: '#f8d7da', border: '2px solid #dc3545' }
      }, data.label);
    }

    const nodeTypes = { topic: TopicNode, start: StartNode, end: EndNode };

    // Main App
    function App() {
      const [nodes, setNodes] = useState([]);
      const [edges, setEdges] = useState([]);
      const [stats, setStats] = useState({ nodes: 0, edges: 0, phases: {} });

      useEffect(() => {
        const { nodes: flowNodes, edges: flowEdges } = parseFrontendData(GRAPH_DATA);
        setNodes(flowNodes);
        setEdges(flowEdges);
        
        // Stats
        const phaseCount = {};
        flowNodes.forEach(n => {
          const p = n.data.phase;
          if (p) phaseCount[p] = (phaseCount[p] || 0) + 1;
        });
        setStats({ nodes: flowNodes.length, edges: flowEdges.length, phases: phaseCount });
      }, []);

      const onNodesChange = useCallback((changes) => setNodes(ns => ns), []);
      const onEdgesChange = useCallback((changes) => setEdges(es => es), []);

      const phaseColors = { 1: '#2b78e4', 2: '#27ae60', 3: '#8e44ad', 4: '#f39c12', 5: '#e74c3c', 6: '#16a085' };
      const phaseNames = { 1: 'THIẾT LẬP', 2: 'DATA MODEL', 3: 'CORE AI', 4: 'CẤU HÌNH', 5: 'UI', 6: 'TEST' };

      return React.createElement('div', { style: { width: '100%', height: '100vh' } }, [
        React.createElement(ReactFlow, {
          key: 'flow',
          nodes: nodes,
          edges: edges,
          onNodesChange: onNodesChange,
          onEdgesChange: onEdgesChange,
          nodeTypes: nodeTypes,
          defaultViewport: { x: 0, y: 0, zoom: 0.6 },
          fitView: true,
          minZoom: 0.3,
          maxZoom: 2,
        }, [
          React.createElement(Background, { key: 'bg', color: '#e0e0e0', gap: 16 }),
          React.createElement(Controls, { key: 'controls' }),
          React.createElement(MiniMap, { key: 'minimap', nodeColor: (node) => phaseColors[node.data.phase] || '#333' }),
        ]),
        React.createElement('div', {
          key: 'stats',
          id: 'stats',
          style: { 
            position: 'fixed', bottom: 16, left: 16, zIndex: 100,
            background: 'white', padding: '12px 16px', borderRadius: 8,
            boxShadow: '0 2px 8px rgba(0,0,0,0.1)', fontSize: '12px',
            fontFamily: 'monospace'
          }
        }, [
          React.createElement('div', { key: 'total' }, `Nodes: ${stats.nodes} | Edges: ${stats.edges}`),
          React.createElement('div', { key: 'phases' }, 
            Object.entries(stats.phases)
              .sort(([a],[b]) => a-b)
              .map(([p, c]) => React.createElement('span', { 
                key: p, 
                style: { 
                  display: 'inline-block', margin: '4px 8px 0 0', padding: '2px 8px',
                  background: phaseColors[p] || '#333', color: 'white', borderRadius: '4px', fontSize: '10px'
                }
              }, `${phaseNames[p]}: ${c}`))
          )
        ])
      ]);
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
