version: '3.8'

services:
  knowledge-tree-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-tree-mcp
    restart: unless-stopped
    ports:
      - "8888:8000"
    env_file:
      - .env
    environment:
      - FASTMCP_TRANSPORT=http
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000
      # LLM: use SAAS_OLLAMA_CLOUD_API_KEY from .env as OPENAI_API_KEY fallback
      - OPENAI_API_KEY=${SAAS_OLLAMA_CLOUD_API_KEY:-ollama}
      - OPENAI_BASE_URL=http://172.17.0.1:11434/v1
      - OPENAI_MODEL=deepseek-v4-flash:cloud
      # Supabase: bắt buộc phải có trong .env (không còn hardcoded fallback)
      - SUPABASE_URL=${SUPABASE_URL}
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
