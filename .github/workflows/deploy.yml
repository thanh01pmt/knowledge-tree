name: Deploy Multi-MCP Server to Oracle Cloud VM

on:
  workflow_dispatch:
  push:
    branches:
      - stable

jobs:
  deploy:
    name: Build & Deploy to Remote Oracle VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Deploy to Remote VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Automated Deployment on Oracle VM for branch '${{ github.ref_name }}'..."
            
            # Navigate to project directory
            cd /home/ubuntu/knowledge-tree
            
            # Ensure git repo exists (clone if missing)
            if [ ! -d .git ]; then
              echo "⚠️ No .git found — cloning fresh..."
              cd /home/ubuntu
              rm -rf knowledge-tree
              git clone https://github.com/thanh01pmt/knowledge-tree.git
              cd knowledge-tree
            fi
            
            # Fetch and reset to latest
            git fetch --all
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            
            # Rebuild image without cache, then restart container
            docker compose build --no-cache
            docker compose up -d
            
            # Verify container health
            sleep 5
            curl -s http://localhost:8888/health
            
            echo "✅ Deployment Completed Successfully!"
